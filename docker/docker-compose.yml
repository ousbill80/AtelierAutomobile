name: atelieros

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelieros
      POSTGRES_PASSWORD: atelieros
      POSTGRES_DB: atelieros
    ports:
      - "55432:5432" # 5432/5433 déjà pris par d'autres services locaux sur certaines machines dev
    volumes:
      - atelieros-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelieros"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # 6379 est déjà pris par un Redis natif sur certaines machines dev
    volumes:
      - atelieros-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atelieros
      MINIO_ROOT_PASSWORD: atelieros123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - atelieros-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  atelieros-postgres:
  atelieros-redis:
  atelieros-minio:
