name: atelieros

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelieros
      POSTGRES_PASSWORD: atelieros
      POSTGRES_DB: atelieros
    ports:
      - "55432:5432" # 5432/5433 déjà pris par d'autres services locaux sur certaines machines dev
    volumes:
      - atelieros-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelieros"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # 6379 est déjà pris par un Redis natif sur certaines machines dev
    volumes:
      - atelieros-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 de dev : moto (émulateur compatible S3). MinIO n'est plus publié sur
  # Docker Hub (`minio/minio` → 404). Moto garde les fichiers en mémoire : ils sont perdus
  # au redémarrage du conteneur, ce qui suffit en dev (imports relançables).
  s3:
    image: motoserver/moto:5.2.4
    restart: unless-stopped
    ports:
      - "9000:5000"

  # Crée le bucket au démarrage (le code ne le crée pas lui-même) ; idempotent.
  s3-init:
    image: curlimages/curl:8.23.0
    depends_on:
      - s3
    entrypoint: >
      sh -c "for i in $$(seq 1 30); do curl -sf http://s3:5000/moto-api/ >/dev/null && break; sleep 1; done
      && curl -sf -X PUT http://s3:5000/atelieros-dev && echo 'bucket atelieros-dev prêt'"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  atelieros-postgres:
  atelieros-redis:
