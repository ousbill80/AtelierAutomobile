# ==============================================================================
# docker-compose.prod.yml — AtelierOS Déploiement VPS Production
# Caddy (HTTPS auto) + Next.js (web) + BullMQ (worker) + Postgres + Redis + MinIO
# ==============================================================================

name: atelieros-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Support HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - atelieros-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelieros-network

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelieros-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelieros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelieros_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-atelieros}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups_data:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelieros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atelieros-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atelieros-network

  # Stockage objet local (utilisé si S3_DRIVER=s3 local ou MinIO sur VPS)
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-atelieros}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-atelieros_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - atelieros-network

networks:
  atelieros-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  backups_data:
