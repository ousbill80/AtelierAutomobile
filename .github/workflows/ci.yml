# Étape 2.5 — CI : `pnpm check` (lint + typecheck + tests) puis E2E Playwright, sur chaque
# push et chaque pull request. Les services reprennent docker/docker-compose.yml (mêmes ports
# et identifiants que .env.example), pour que la CI tourne comme un poste de dev.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://atelieros:atelieros@localhost:55432/atelieros?schema=public
  DATABASE_APP_URL: postgresql://atelieros_app:atelieros_app@localhost:55432/atelieros?schema=public
  REDIS_URL: redis://localhost:6380
  APP_URL: http://localhost:3000
  APP_ENV: development
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: atelieros-dev
  S3_ACCESS_KEY: atelieros
  S3_SECRET_KEY: atelieros123
  DEFAULT_TIMEZONE: Africa/Abidjan
  # Clés de test uniquement (jamais utilisées hors CI).
  ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
  AUTH_SECRET: ci-only-auth-secret

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelieros
          POSTGRES_PASSWORD: atelieros
          POSTGRES_DB: atelieros
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelieros" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # Émulateur S3 (moto) : MinIO n'est plus publié sur Docker Hub.
      s3:
        image: motoserver/moto:5.2.4
        ports: ["9000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bucket S3
        run: ./scripts/ci-s3.sh
      - name: Migrations
        run: pnpm db:migrate
      - name: pnpm check
        run: pnpm check

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelieros
          POSTGRES_PASSWORD: atelieros
          POSTGRES_DB: atelieros
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelieros" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # Émulateur S3 (moto) : MinIO n'est plus publié sur Docker Hub.
      s3:
        image: motoserver/moto:5.2.4
        ports: ["9000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bucket S3
        run: ./scripts/ci-s3.sh
      - name: Migrations
        run: pnpm db:migrate
      - name: Navigateur Playwright
        run: pnpm --filter @atelieros/web exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter @atelieros/web build
      - name: E2E
        run: pnpm --filter @atelieros/web test:e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
