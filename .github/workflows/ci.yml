# Étape 2.5 — CI : `pnpm check` (lint + typecheck + tests) puis E2E Playwright. Les services
# reprennent docker/docker-compose.yml (mêmes ports et identifiants que .env.example), pour que la
# CI tourne comme un poste de dev.
#
# Économie de minutes GitHub Actions (arbitrage A16, docs/04) :
# - une seule exécution par changement : uniquement sur les pull requests prêtes, jamais sur push
#   (la session d'intégration ne fusionne qu'une PR dont la tête contient déjà `main` : la CI de la
#   PR a donc testé exactement l'arbre qui arrive dans `main`) ;
# - les PR en brouillon ne lancent rien ; la CI part au passage « Ready for review » ;
# - un push qui ne touche que la documentation (docs/, *.md) ne lance rien ;
# - un nouveau push annule l'exécution en cours de la même PR ;
# - E2E seulement si « Lint, types, tests » est vert ; caches pnpm, Turborepo, Next.js, Playwright ;
# - lancement manuel possible (workflow_dispatch), par exemple pour revérifier `main`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://atelieros:atelieros@localhost:55432/atelieros?schema=public
  DATABASE_APP_URL: postgresql://atelieros_app:atelieros_app@localhost:55432/atelieros?schema=public
  REDIS_URL: redis://localhost:6380
  APP_URL: http://localhost:3000
  APP_ENV: development
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: atelieros-dev
  S3_ACCESS_KEY: atelieros
  S3_SECRET_KEY: atelieros123
  DEFAULT_TIMEZONE: Africa/Abidjan
  # Clés de test uniquement (jamais utilisées hors CI).
  ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
  AUTH_SECRET: ci-only-auth-secret

jobs:
  check:
    name: Lint, types, tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelieros
          POSTGRES_PASSWORD: atelieros
          POSTGRES_DB: atelieros
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelieros" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # Émulateur S3 (moto) : MinIO n'est plus publié sur Docker Hub.
      s3:
        image: motoserver/moto:5.2.4
        ports: ["9000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bucket S3
        run: ./scripts/ci-s3.sh
      - name: Migrations
        run: pnpm db:migrate
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: pnpm check
        run: pnpm check --cache-dir=.turbo

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelieros
          POSTGRES_PASSWORD: atelieros
          POSTGRES_DB: atelieros
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelieros" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
      # Émulateur S3 (moto) : MinIO n'est plus publié sur Docker Hub.
      s3:
        image: motoserver/moto:5.2.4
        ports: ["9000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bucket S3
        run: ./scripts/ci-s3.sh
      - name: Migrations
        run: pnpm db:migrate
      - name: Cache navigateur Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Navigateur Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @atelieros/web exec playwright install --with-deps chromium
      - name: Dépendances système Playwright
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @atelieros/web exec playwright install-deps chromium
      - name: Cache build Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build web
        run: pnpm --filter @atelieros/web build
      - name: E2E
        run: pnpm --filter @atelieros/web test:e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
