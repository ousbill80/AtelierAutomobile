<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Hors connexion — AtelierOS</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a; color: #f8fafc; padding: 24px; box-sizing: border-box; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #cbd5e1; line-height: 1.5; margin: 0 0 24px; }
      button {
        min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; font-size: 16px;
        font-weight: 600; background: #eb6120; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion internet</h1>
      <p>
        AtelierOS a besoin du réseau pour afficher cette page. Vérifiez le Wi-Fi ou les données
        mobiles, puis réessayez. La tablette d'atelier continue de fonctionner hors-ligne.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
